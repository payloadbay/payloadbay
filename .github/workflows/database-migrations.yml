name: Generate Migrations
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - packages/domain/src/schema.ts
      - packages/domain/sql/**
      - packages/domain/drizzle.config.ts
      - scripts/database/**
      - .github/workflows/database-migrations.yml
concurrency:
  group: payloadbay-migration-generation
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      PAYLOADBAY_MIGRATION_WORKFLOW: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun package downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/bun-public-cache
          key: bun-public-${{ runner.os }}-1.3.14-${{ hashFiles('bun.lock') }}
      - name: Install dependency graph
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-public-cache
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Generate the single merged-change migration
        run: bun run db:generate:ci
      - name: Commit CI-owned artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/domain/drizzle
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'build(db): generate merged schema migration'
          git push
