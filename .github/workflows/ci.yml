name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full commit SHA reviewed for a trusted validation run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.reviewed_sha || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Validate build authorization
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      ref: ${{ steps.policy.outputs.ref }}
      environment: ${{ steps.policy.outputs.environment }}
    steps:
      - name: Validate immutable source and protected external review
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TEST_REF: ${{ inputs.reviewed_sha || github.event.pull_request.head.sha || github.sha }}
          EXTERNAL_REQUEST: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [[ ! "$TEST_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'An immutable full source commit SHA is required.' >&2
            exit 1
          fi
          if [[ "$EXTERNAL_REQUEST" == 'true' ]]; then
            reviewer_protection=$(gh api "repos/$REPOSITORY/environments/ci-external-review" --jq 'any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | length) > 0)') || {
              echo 'External review protection could not be verified.' >&2
              exit 1
            }
            if [[ "$reviewer_protection" != 'true' ]]; then
              echo 'Configure ci-external-review with required maintainer reviewers before external licensed checks can run.' >&2
              exit 1
            fi
            echo 'environment=ci-external-review' >> "$GITHUB_OUTPUT"
          else
            echo 'environment=none' >> "$GITHUB_OUTPUT"
          fi
          echo "ref=$TEST_REF" >> "$GITHUB_OUTPUT"

  review:
    name: Approve external source
    needs: policy
    if: needs.policy.outputs.environment == 'ci-external-review'
    runs-on: ubuntu-24.04
    environment:
      name: ci-external-review
      deployment: false
    steps:
      - name: Record external approval
        run: echo 'External source review approved.' >> "$GITHUB_STEP_SUMMARY"

  authorize:
    name: Authorize source ${{ needs.policy.outputs.ref }}
    needs: [policy, review]
    if: always() && needs.policy.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Record authorized build source
        env:
          TEST_REF: ${{ needs.policy.outputs.ref }}
          REVIEW_ENVIRONMENT: ${{ needs.policy.outputs.environment }}
          REVIEW_RESULT: ${{ needs.review.result }}
        run: |
          if [[ "$REVIEW_ENVIRONMENT" == 'none' && "$REVIEW_RESULT" == 'skipped' ]] || [[ "$REVIEW_ENVIRONMENT" == 'ci-external-review' && "$REVIEW_RESULT" == 'success' ]]; then
            echo "Authorized validation of $TEST_REF" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Source authorization is incomplete or requires maintainer review.' >&2
            exit 1
          fi

  checks:
    name: CI / ${{ matrix.lane }}
    needs: [policy, authorize]
    if: ${{ !cancelled() && needs.policy.result == 'success' && needs.authorize.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [static, unit, node, executor, browser, performance, deployment]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=3072
      PAB_TEST_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
    steps:
      - name: Check out the tested source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.policy.outputs.ref }}
          persist-credentials: false

      - name: Set up production Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.3"

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Restore public dependency downloads
        id: public-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/bun-public-cache
          key: bun-public-${{ runner.os }}-1.3.14-${{ hashFiles('bun.lock') }}

      - name: Install locked dependencies
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-public-cache
        run: bun install --frozen-lockfile

      - name: Save public dependency downloads
        if: steps.public-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/bun-public-cache
          key: bun-public-${{ runner.os }}-1.3.14-${{ hashFiles('bun.lock') }}

      - name: Install source inventory prerequisite
        if: matrix.lane == 'node' || matrix.lane == 'browser' || matrix.lane == 'performance' || matrix.lane == 'deployment'
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Install the browser test runtime
        if: matrix.lane == 'browser'
        run: bun x --no-install playwright install --with-deps chromium

      - name: Run the owning checks once
        env:
          TEST_LANE: ${{ matrix.lane }}
        run: |
          case "$TEST_LANE" in
            static)
              bun run test:inventory
              bun run typecheck
              bun run lint
              bun run format:check
              ;;
            unit) bun run test:unit --collect-coverage ;;
            node) bun run test:integration --collect-coverage ;;
            executor) bun run test:executor --collect-coverage ;;
            browser) bun run test:browser --collect-coverage ;;
            performance) bun run test:performance ;;
            deployment) bun run test:deployment --collect-coverage ;;
            *) exit 1 ;;
          esac

      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  coverage:
    name: CI / merged source coverage
    needs: [policy, authorize, checks]
    if: ${{ !cancelled() && needs.policy.result == 'success' && needs.authorize.result == 'success' && needs.checks.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact validated source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.policy.outputs.ref }}
          persist-credentials: false

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install public locked reporting dependencies
        run: bun install --frozen-lockfile

      - name: Download this run's owning reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ci-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/owners

      - name: Require source-mapped per-file line and function coverage
        run: bun run test:coverage:merge test-results/owners

      - name: Preserve the merged coverage decision
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/owners/coverage-summary.json
          if-no-files-found: warn
          retention-days: 7

  result:
    name: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository)) && 'CI delegation' || 'CI validation' }}
    if: always() && needs.policy.result != 'skipped'
    needs: [policy, authorize, checks, coverage]
    runs-on: ubuntu-24.04
    steps:
      - name: Require complete passing validation
        env:
          CHECK_RESULT: ${{ needs.checks.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          AUTHORIZATION_RESULT: ${{ needs.authorize.result }}
        run: |
          if [[ "$CHECK_RESULT" != 'success' || "$COVERAGE_RESULT" != 'success' || "$POLICY_RESULT" != 'success' || "$AUTHORIZATION_RESULT" != 'success' ]]; then
            echo 'CI validation is incomplete or requires maintainer review.' >&2
            exit 1
          fi
