name: Alpha Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full commit SHA reviewed for a trusted validation run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: alpha-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.reviewed_sha || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Validate build authorization
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      ref: ${{ steps.policy.outputs.ref }}
      environment: ${{ steps.policy.outputs.environment }}
    steps:
      - name: Validate immutable source and protected external review
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TEST_REF: ${{ inputs.reviewed_sha || github.event.pull_request.head.sha || github.sha }}
          EXTERNAL_REQUEST: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [[ ! "$TEST_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'An immutable full source commit SHA is required.' >&2
            exit 1
          fi
          if [[ "$EXTERNAL_REQUEST" == 'true' ]]; then
            reviewer_protection=$(gh api "repos/$REPOSITORY/environments/alpha-ci-external" --jq 'any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | length) > 0)') || {
              echo 'External review protection could not be verified.' >&2
              exit 1
            }
            if [[ "$reviewer_protection" != 'true' ]]; then
              echo 'Declare alpha-ci-external with maintainer required reviewers in the repository baseline before external licensed checks can run.' >&2
              exit 1
            fi
            echo 'environment=alpha-ci-external' >> "$GITHUB_OUTPUT"
          else
            echo 'environment=alpha-ci' >> "$GITHUB_OUTPUT"
          fi
          echo "ref=$TEST_REF" >> "$GITHUB_OUTPUT"

  authorize:
    name: Authorize source ${{ needs.policy.outputs.ref }}
    needs: policy
    runs-on: ubuntu-24.04
    environment: ${{ needs.policy.outputs.environment }}
    steps:
      - name: Record authorized build source
        env:
          TEST_REF: ${{ needs.policy.outputs.ref }}
        run: echo "Authorized validation of $TEST_REF" >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Alpha / ${{ matrix.lane }}
    needs: [policy, authorize]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [static, unit, node, executor, browser, performance, deployment]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=3072
      PAB_TEST_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
    steps:
      - name: Check out the tested source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.policy.outputs.ref }}
          persist-credentials: false

      - name: Set up production Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.3'

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - name: Restore public dependency downloads
        id: public-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/bun-public-cache
          key: bun-public-${{ runner.os }}-1.3.14-${{ hashFiles('bun.lock') }}

      - name: Install locked dependencies
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-public-cache
        run: bun install --frozen-lockfile

      - name: Save public dependency downloads before licensed installation
        if: steps.public-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/bun-public-cache
          key: bun-public-${{ runner.os }}-1.3.14-${{ hashFiles('bun.lock') }}

      - name: Install licensed UI for the trusted source
        if: matrix.lane != 'unit' && matrix.lane != 'executor'
        working-directory: apps/web
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-licensed-cache
        run: |
          if [[ -z "$HEROUI_AUTH_TOKEN" ]]; then
            echo 'HEROUI_AUTH_TOKEN must be configured as a repository Actions secret.' >&2
            exit 1
          fi
          bun x heroui-pro@1.0.0-beta.14 install react --yes --skip-peers --no-trust-patch

      - name: Install source inventory prerequisite
        if: matrix.lane == 'node' || matrix.lane == 'browser' || matrix.lane == 'performance' || matrix.lane == 'deployment'
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Install the browser test runtime
        if: matrix.lane == 'browser'
        run: bun x --no-install playwright install --with-deps chromium

      - name: Run the owning checks once
        env:
          TEST_LANE: ${{ matrix.lane }}
        run: |
          case "$TEST_LANE" in
            static)
              bun run test:inventory
              bun run typecheck
              bun run lint
              bun run format:check
              ;;
            unit) bun run test:coverage ;;
            node) bun run test:integration --collect-coverage ;;
            executor) bun run test:executor --collect-coverage ;;
            browser) bun run test:browser ;;
            performance) bun run test:performance ;;
            deployment) bun run test:deployment --collect-coverage ;;
            *) exit 1 ;;
          esac

      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alpha-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  result:
    name: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository)) && 'CI delegation' || 'Alpha validation' }}
    if: always() && needs.policy.result != 'skipped'
    needs: [policy, authorize, checks]
    runs-on: ubuntu-24.04
    steps:
      - name: Require complete passing validation
        env:
          CHECK_RESULT: ${{ needs.checks.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          AUTHORIZATION_RESULT: ${{ needs.authorize.result }}
        run: |
          if [[ "$CHECK_RESULT" != 'success' || "$POLICY_RESULT" != 'success' || "$AUTHORIZATION_RESULT" != 'success' ]]; then
            echo 'Alpha validation is incomplete or requires maintainer review.' >&2
            exit 1
          fi
