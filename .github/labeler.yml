version: 1

labels:
  # Feature and improvement request types
  # Compatibility contract with ISSUE_TEMPLATE/feature-request.yml:
  # These rules match the dropdown option values as exact lines. Update and
  # test both files together whenever an option value is renamed.
  - label: feature
    type: issue
    body: '(?m)^New product capability\r?$'

  - label: improvement
    type: issue
    body: '(?m)^Improvement to an existing capability\r?$'

  # Pull request types
  - label: bug
    type: pull_request
    body: '(?m)^- \[[xX]\] 🐛 Bug fix$'

  - label: feature
    type: pull_request
    body: '(?m)^- \[[xX]\] ✨ New feature$'

  - label: improvement
    type: pull_request
    body: '(?m)^- \[[xX]\] 🔧 Improvement to existing behavior$'

  - label: breaking change
    type: pull_request
    body: '(?m)^- \[[xX]\] 💥 Breaking change$'

  - label: maintenance
    type: pull_request
    body: '(?m)^- \[[xX]\] ♻️ Refactor without an intended behavior change$'

  - label: documentation
    type: pull_request
    body: '(?m)^- \[[xX]\] 🧾 Documentation$'

  - label: tests
    type: pull_request
    body: '(?m)^- \[[xX]\] 🧪 Tests$'

  - label: maintenance
    type: pull_request
    body: '(?m)^- \[[xX]\] 🤖 CI/CD or automation$'

  - label: dependencies
    type: pull_request
    body: '(?m)^- \[[xX]\] ⬆️ Dependency update$'

  - label: maintenance
    type: pull_request
    body: '(?m)^- \[[xX]\] 🧹 Maintenance$'

  # Planned-work issue types. GitHub renders multi-select dropdowns as a
  # comma-separated line, so match complete option tokens.
  - label: bug
    type: issue
    title: '^\[Planned\]:'
    body: '(?m)^### Type of work\r?\n\r?\n(?:[^,\r\n]+,\s*)*🐛 Bug fix(?:,\s*[^,\r\n]+)*\r?$'

  - label: feature
    type: issue
    title: '^\[Planned\]:'
    body: '(?m)^### Type of work\r?\n\r?\n(?:[^,\r\n]+,\s*)*✨ New feature(?:,\s*[^,\r\n]+)*\r?$'

  - label: improvement
    type: issue
    title: '^\[Planned\]:'
    body: '(?m)^### Type of work\r?\n\r?\n(?:[^,\r\n]+,\s*)*🔧 Improvement to existing behavior(?:,\s*[^,\r\n]+)*\r?$'

  - label: breaking change
    type: issue
    title: '^\[Planned\]:'
    body: '(?m)^### Type of work\r?\n\r?\n(?:[^,\r\n]+,\s*)*💥 Breaking change(?:,\s*[^,\r\n]+)*\r?$'

  - label: maintenance
    type: issue
    title: '^\[Planned\]:'
    body: '(?m)^### Type of work\r?\n\r?\n(?:[^,\r\n]+,\s*)*♻️ Refactor without an intended behavior change(?:,\s*[^,\r\n]+)*\r?$'

  - label: documentation
    type: issue
    title: '^\[Planned\]:'
    body: '(?m)^### Type of work\r?\n\r?\n(?:[^,\r\n]+,\s*)*🧾 Documentation(?:,\s*[^,\r\n]+)*\r?$'

  - label: tests
