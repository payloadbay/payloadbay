    body: '(?m)^### Type of work\r?\n\r?\n(?:[^,\r\n]+,\s*)*🧪 Tests(?:,\s*[^,\r\n]+)*\r?$'

  - label: maintenance
    type: issue
    title: '^\[Planned\]:'
    body: '(?m)^### Type of work\r?\n\r?\n(?:[^,\r\n]+,\s*)*🤖 CI/CD or automation(?:,\s*[^,\r\n]+)*\r?$'

  - label: dependencies
