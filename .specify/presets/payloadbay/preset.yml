schema_version: "1.0"

preset:
  id: payloadbay
  name: Payload Bay Development
  version: "0.1.0"
  description: "Small, understandable changes with test-first behavior, scoped feedback and complete delivery gates."
  author: Payload Bay
  repository: https://github.com/payloadbay/.github
  license: MIT

requires:
  speckit_version: ">=1.1.3,<2.0.0"

provides:
  templates:
    - type: template
      name: constitution-template
      file: templates/constitution-addendum.md
      strategy: append
    - type: template
      name: spec-template
      file: templates/spec-addendum.md
      strategy: append
    - type: template
      name: plan-template
      file: templates/plan-addendum.md
      strategy: append
    - type: template
      name: tasks-template
      file: templates/tasks-addendum.md
      strategy: append
    - type: command
      name: speckit.constitution
      file: commands/speckit.constitution.md
      strategy: wrap
    - type: command
      name: speckit.specify
      file: commands/speckit.specify.md
      strategy: wrap
    - type: command
      name: speckit.plan
      file: commands/speckit.plan.md
      strategy: wrap
    - type: command
      name: speckit.tasks
      file: commands/speckit.tasks.md
      strategy: wrap
    - type: command
      name: speckit.implement
      file: commands/speckit.implement.md
      strategy: wrap
    - type: command
      name: speckit.analyze
      file: commands/speckit.analyze.md
      strategy: wrap

tags:
  - tdd
  - scoped-testing
  - quality-gates
  - understandable-changes
